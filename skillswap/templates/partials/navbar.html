<!-- ============================================================
     navbar.html
     Sticky navigation bar. Shows different actions depending on
     whether the visitor is logged in (session['user_id']).
     ============================================================ -->
<nav class="navbar" id="navbar">
    <div class="navbar-inner">

        <a href="{{ url_for('main.landing') }}" class="navbar-logo">
            <span class="logo-mark">S</span>
            SkillSwap
        </a>

        <div class="navbar-links" id="navbarLinks">
            <a href="{{ url_for('main.landing') }}#how-it-works">How It Works</a>
            <a href="{{ url_for('main.browse_skills') }}">Browse Skills</a>
            <a href="{{ url_for('main.landing') }}#categories">Categories</a>
            {% if session.get('user_id') %}
                <a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
                <a href="{{ url_for('swap.swap_requests') }}">Swap Requests</a>
                <a href="{{ url_for('chat.chat') }}">Messages</a>
            {% endif %}
        </div>

        <div class="navbar-actions">
            {% if session.get('user_id') %}
                <a href="{{ url_for('chat.chat') }}" class="navbar-bell" title="Messages">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <span class="bell-dot"></span>
                </a>
                <a href="{{ url_for('profile.view_profile', user_id=session['user_id']) }}" class="navbar-user">
                    <img src="{{ url_for('static', filename='uploads/profile_pics/' + (session.get('profile_image') or 'default-avatar.png')) }}"
                         alt="Profile" class="avatar avatar-sm"
                         onerror="this.src='{{ url_for('static', filename='images/illustrations/default-avatar.png') }}'">
                </a>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-ghost btn-sm">Logout</a>
            {% else %}
                <a href="{{ url_for('auth.login') }}" class="btn btn-secondary btn-sm">Log In</a>
                <a href="{{ url_for('auth.signup') }}" class="btn btn-primary btn-sm"><span>Get Started</span></a>
            {% endif %}

            <button class="navbar-toggle" id="navbarToggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>

    </div>
</nav>
